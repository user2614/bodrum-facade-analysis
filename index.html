<style>

    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .subtitle { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--gold); letter-spacing: 1px; }
    
    .nav-container { display: flex; gap: 10px; height: 100%; align-items: center; }
    .nav-btn {
        background: transparent; border: 1px solid transparent; color: var(--text);
        padding: 8px 16px; font-family: 'JetBrains Mono'; font-size: 12px;
        cursor: pointer; transition: 0.3s; height: 36px; display: flex; align-items: center;
        border-radius: 4px; letter-spacing: 0.5px;
    }
    .nav-btn:hover { background: rgba(200,169,110,0.05); color: var(--gold); }
    .nav-btn.active { border: 1px solid var(--gold); background: rgba(200,169,110,0.1); color: var(--gold); box-shadow: 0 0 10px rgba(200,169,110,0.2); }

    #content-area { flex: 1; position: relative; background: var(--bg); width: 100%; }

</style>

            .attr(&quot;d&quot;, `M ${width - margin.right - 12},${yScale(0) - 5} L ${width - margin.right},${yScale(0)} L ${width - margin.right - 12},${yScale(0) + 5}`)
            .attr(&quot;fill&quot;, &quot;none&quot;).attr(&quot;stroke&quot;, &quot;var(--gold)&quot;).attr(&quot;stroke-width&quot;, 1.5);

        // Mimari Metinler
        svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;tech-label&quot;).attr(&quot;x&quot;, xScale(0)).attr(&quot;y&quot;, margin.top - 25).attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(&quot;WINDOW RATIO (%)&quot;);
        svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;tech-label&quot;).attr(&quot;transform&quot;, &quot;rotate(-90)&quot;).attr(&quot;x&quot;, -(margin.top + 60)).attr(&quot;y&quot;, margin.left - 40).attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(&quot;STONE FACADES&quot;);
        svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;tech-label&quot;).attr(&quot;transform&quot;, &quot;rotate(90)&quot;).attr(&quot;x&quot;, (margin.top + 60)).attr(&quot;y&quot;, -(width - margin.right + 40)).attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(&quot;WHITE FACADES&quot;);
        svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;tech-label&quot;).attr(&quot;x&quot;, width - margin.right + 15).attr(&quot;y&quot;, yScale(0) + 4).attr(&quot;text-anchor&quot;, &quot;start&quot;).text(&quot;FRAME RATIO (%)&quot;);

        // Sayısız Cetvel (Sadece Merkez Orijin 0)
        [-0.30,-0.20,-0.10,0,0.10,0.20,0.30].forEach(xt =&gt; {
            const xPx = xScale(xt), yPx = yScale(0) + 18;
            svg.append(&quot;rect&quot;).attr(&quot;x&quot;, xPx - 13).attr(&quot;y&quot;, yPx - 11).attr(&quot;width&quot;, 26).attr(&quot;height&quot;, 14).attr(&quot;fill&quot;, &quot;var(--bg)&quot;).attr(&quot;opacity&quot;, 0.85).attr(&quot;rx&quot;, 2);
            svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-tick-text&quot;).attr(&quot;x&quot;, xPx).attr(&quot;y&quot;, yPx).attr(&quot;text-anchor&quot;, &quot;middle&quot;).text((Math.abs(xt)*100).toFixed(0)+&quot;%&quot;);
        });
        
        const yTicks = [{v: 0, l: &quot;0%&quot;}, {v: 0.10, l: &quot;10%&quot;}, {v: 0.20, l: &quot;20%&quot;}, {v: 0.30, l: &quot;30%&quot;}, {v: 0.40, l: &quot;40%&quot;}];
        yTicks.forEach(t =&gt; {
            const xPos = xScale(0) + 8, yPos = yScale(t.v) + 4;
            svg.append(&quot;rect&quot;).attr(&quot;x&quot;, xPos - 4).attr(&quot;y&quot;, yPos - 11).attr(&quot;width&quot;, 32).attr(&quot;height&quot;, 14).attr(&quot;fill&quot;, &quot;var(--bg)&quot;).attr(&quot;opacity&quot;, 0.85).attr(&quot;rx&quot;, 2);
            svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-tick-text&quot;).attr(&quot;x&quot;, xPos).attr(&quot;y&quot;, yPos).attr(&quot;text-anchor&quot;, &quot;start&quot;).text(t.l);
        });

        svg.selectAll(&quot;.dot&quot;).data(data).enter().append(&quot;path&quot;)
            .attr(&quot;class&quot;, &quot;dot&quot;).attr(&quot;id&quot;, (d, i) =&gt; `dot-${i}`)
            .attr(&quot;d&quot;, d =&gt; {
                const cx = d._px, cy = d._py, r = 6;
                if (d.malzeme === &#x27;t&#x27;) return `M ${cx},${cy-r} L ${cx+r},${cy} L ${cx},${cy+r} L ${cx-r},${cy} Z`;
                return `M ${cx},${cy} m -${r},0 a ${r},${r} 0 1,0 ${r*2},0 a ${r},${r} 0 1,0 -${r*2},0`;
            })
            .attr(&quot;fill&quot;, d =&gt; d[&quot;Söve Rengi (HEX)&quot;] || &quot;#ffffff&quot;)
            .attr(&quot;opacity&quot;, 0.85)
            .on(&quot;click&quot;, (e, d) =&gt; selectBuilding(d, data.indexOf(d)));

        data.forEach((d, i) =&gt; {
            const item = d3.select(&quot;#gallery-list&quot;).append(&quot;div&quot;).attr(&quot;class&quot;, &quot;gallery-item&quot;).attr(&quot;id&quot;, `gallery-item-${i}`).on(&quot;click&quot;, () =&gt; selectBuilding(d, i));
            const itemSvg = item.append(&quot;svg&quot;).attr(&quot;viewBox&quot;, `${d.bx} ${d.by} ${d.bw} ${d.bh}`);
            const defsT = itemSvg.append(&quot;defs&quot;);
            
            // 🎯 REVIZE: Fihrist thumbnail&#x27;ları için kesme maskesi tanımı
            const clipId = `clip-gallery-${i}`;
            defsT.append(&quot;clipPath&quot;).attr(&quot;id&quot;, clipId)
                .append(&quot;rect&quot;).attr(&quot;x&quot;, d.bx).attr(&quot;y&quot;, d.by).attr(&quot;width&quot;, d.bw).attr(&quot;height&quot;, d.bh);

            const patternT = defsT.append(&quot;pattern&quot;).attr(&quot;id&quot;, `st-${i}`).attr(&quot;patternUnits&quot;, &quot;userSpaceOnUse&quot;).attr(&quot;width&quot;, 72).attr(&quot;height&quot;, 72);
            patternT.append(&quot;rect&quot;).attr(&quot;width&quot;, 72).attr(&quot;height&quot;, 72).attr(&quot;fill&quot;, &quot;rgba(190,175,150,0.04)&quot;);
            // Row 1
            [{x:0,w:46},{x:48,w:22}].forEach(s =&gt; {
                patternT.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x+1).attr(&quot;y&quot;,1).attr(&quot;width&quot;,s.w-2).attr(&quot;height&quot;,34)
                    .attr(&quot;fill&quot;,&quot;rgba(210,190,160,0.04)&quot;).attr(&quot;stroke&quot;,&quot;rgba(200,169,110,0.28)&quot;).attr(&quot;stroke-width&quot;,0.7);
            });
            // Row 2
            [{x:0,w:22},{x:24,w:46}].forEach(s =&gt; {
                patternT.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x+1).attr(&quot;y&quot;,37).attr(&quot;width&quot;,s.w-2).attr(&quot;height&quot;,34)
                    .attr(&quot;fill&quot;,&quot;rgba(190,175,145,0.04)&quot;).attr(&quot;stroke&quot;,&quot;rgba(200,169,110,0.22)&quot;).attr(&quot;stroke-width&quot;,0.7);
            });
            patternT.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,36).attr(&quot;x2&quot;,72).attr(&quot;y2&quot;,36)
                .attr(&quot;stroke&quot;,&quot;rgba(200,169,110,0.18)&quot;).attr(&quot;stroke-width&quot;,1.2);
            
            itemSvg.append(&quot;rect&quot;).attr(&quot;x&quot;, d.bx).attr(&quot;y&quot;, d.by).attr(&quot;width&quot;, d.bw).attr(&quot;height&quot;, d.bh).attr(&quot;fill&quot;, &quot;var(--bg)&quot;);
            itemSvg.append(&quot;rect&quot;).attr(&quot;x&quot;, d.bx).attr(&quot;y&quot;, d.by).attr(&quot;width&quot;, d.bw).attr(&quot;height&quot;, d.bh).attr(&quot;fill&quot;, d.malzeme === &#x27;t&#x27; ? `url(#st-${i})` : &quot;rgba(255, 255, 255, 0.03)&quot;).attr(&quot;stroke&quot;, &quot;var(--gold)&quot;).attr(&quot;stroke-width&quot;, 1.5);
            
            // Move frame drawings inside the mask group so they never overflow
            const maskedGroupT = itemSvg.append(&quot;g&quot;).attr(&quot;clip-path&quot;, `url(#${clipId})`);
            
            (d.pencereler || []).forEach(p =&gt; {
                const vo = p.bbox_width * d.sove_orani; 
                maskedGroupT.append(&quot;rect&quot;).attr(&quot;x&quot;, p.bbox_x).attr(&quot;y&quot;, p.bbox_y).attr(&quot;width&quot;, p.bbox_width).attr(&quot;height&quot;, p.bbox_height).attr(&quot;fill&quot;, &quot;var(--bg)&quot;);
                const pD = `M ${p.bbox_x-vo},${p.bbox_y-vo} h ${p.bbox_width+vo*2} v ${p.bbox_height+vo*2} h ${-p.bbox_width-vo*2} z M ${p.bbox_x},${p.bbox_y} h ${p.bbox_width} v ${p.bbox_height} h ${-p.bbox_width} z`;
                maskedGroupT.append(&quot;path&quot;).attr(&quot;d&quot;, pD).attr(&quot;fill&quot;, d[&quot;Söve Rengi (HEX)&quot;]).attr(&quot;fill-rule&quot;, &quot;evenodd&quot;);
            });
        });

        function selectBuilding(d, i) {
            d3.selectAll(&quot;.dot&quot;).classed(&quot;active-dot&quot;, false);
            d3.select(`#dot-${i}`).classed(&quot;active-dot&quot;, true);
            d3.selectAll(&quot;.gallery-item&quot;).classed(&quot;active&quot;, false);
            const activeItem = d3.select(`#gallery-item-${i}`);
            activeItem.classed(&quot;active&quot;, true);
            activeItem.node().scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;nearest&#x27; });
            drawDetailed(d);
        }

        function buildStonePattern(defs, id, scale=1) {
            const bw = 72*scale, bh = 36*scale;
            const pat = defs.append(&quot;pattern&quot;).attr(&quot;id&quot;, id)
                .attr(&quot;patternUnits&quot;,&quot;userSpaceOnUse&quot;)
                .attr(&quot;width&quot;, bw).attr(&quot;height&quot;, bh*2);
            // Base fill
            pat.append(&quot;rect&quot;).attr(&quot;width&quot;, bw).attr(&quot;height&quot;, bh*2).attr(&quot;fill&quot;,&quot;rgba(190,175,150,0.04)&quot;);
            // Row 1 stones
            const stones1 = [{x:0,w:46},{x:48,w:22}];
            const stones2 = [{x:0,w:22},{x:24,w:44}];
            stones1.forEach(s =&gt; {
                pat.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x*scale+1).attr(&quot;y&quot;,1).attr(&quot;width&quot;,(s.w*scale)-2).attr(&quot;height&quot;,bh-2)
                    .attr(&quot;fill&quot;,&quot;rgba(210,190,160,0.04)&quot;).attr(&quot;stroke&quot;,&quot;rgba(200,169,110,0.28)&quot;).attr(&quot;stroke-width&quot;,0.8);
                pat.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x*scale+2).attr(&quot;y&quot;,2).attr(&quot;width&quot;,(s.w*scale)-4).attr(&quot;height&quot;,bh*0.35)
                    .attr(&quot;fill&quot;,&quot;rgba(255,255,255,0.015)&quot;);
            });
            stones2.forEach(s =&gt; {
                pat.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x*scale+1).attr(&quot;y&quot;,bh+1).attr(&quot;width&quot;,(s.w*scale)-2).attr(&quot;height&quot;,bh-2)
                    .attr(&quot;fill&quot;,&quot;rgba(190,175,145,0.04)&quot;).attr(&quot;stroke&quot;,&quot;rgba(200,169,110,0.22)&quot;).attr(&quot;stroke-width&quot;,0.8);
                pat.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x*scale+2).attr(&quot;y&quot;,bh+2).attr(&quot;width&quot;,(s.w*scale)-4).attr(&quot;height&quot;,bh*0.35)
                    .attr(&quot;fill&quot;,&quot;rgba(255,255,255,0.012)&quot;);
            });
            // horizontal mortar lines
            pat.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,bh).attr(&quot;x2&quot;,bw).attr(&quot;y2&quot;,bh)
                .attr(&quot;stroke&quot;,&quot;rgba(200,169,110,0.18)&quot;).attr(&quot;stroke-width&quot;,1.5);
            return pat;
        }

        function drawDetailed(d) {
            viz.selectAll(&quot;*&quot;).remove();
            const defs = viz.append(&quot;defs&quot;);
            buildStonePattern(defs, &quot;stone-refined&quot;, 1);
            
            const rRect = document.getElementById(&quot;center&quot;).getBoundingClientRect();
            const svgW = rRect.width, svgH = rRect.height;
            let sc = Math.min((svgW * 0.75) / d.bw, (svgH * 0.80) / d.bh);
            // Zemin çizgisi SVG&#x27;nin %85&#x27;inde sabit
            const groundY = svgH * 0.85;
            // Bina tabanı zemine otursun, yatayda ortada
            const tx = (svgW / 2) - ((d.bx + d.bw / 2) * sc);
            const ty = groundY - (d.by + d.bh) * sc;
            const g = viz.append(&quot;g&quot;).attr(&quot;transform&quot;, `translate(${tx}, ${ty})`);
            
            // 🎯 REVIZE: Orta büyük panel çizimi için milimetrik ölçekli kesme maskesi tanımı
            const mainClipId = `clip-main`;
            defs.append(&quot;clipPath&quot;).attr(&quot;id&quot;, mainClipId)
                .append(&quot;rect&quot;).attr(&quot;x&quot;, d.bx*sc).attr(&quot;y&quot;, d.by*sc).attr(&quot;width&quot;, d.bw*sc).attr(&quot;height&quot;, d.bh*sc);

            g.append(&quot;rect&quot;).attr(&quot;x&quot;, d.bx*sc).attr(&quot;y&quot;, d.by*sc).attr(&quot;width&quot;, d.bw*sc).attr(&quot;height&quot;, d.bh*sc).attr(&quot;fill&quot;, &quot;var(--bg)&quot;);
            g.append(&quot;rect&quot;).attr(&quot;x&quot;, d.bx*sc).attr(&quot;y&quot;, d.by*sc).attr(&quot;width&quot;, d.bw*sc).attr(&quot;height&quot;, d.bh*sc).attr(&quot;fill&quot;, d.malzeme === &#x27;t&#x27; ? &quot;url(#stone-refined)&quot; : &quot;rgba(255, 255, 255, 0.03)&quot;).attr(&quot;stroke&quot;, &quot;rgba(255,255,255,0.6)&quot;).attr(&quot;stroke-width&quot;, 2);
            
            // Wall surface gradient for non-stone buildings
            if (d.malzeme !== &#x27;t&#x27;) {
                const wallGradId = &quot;wall-grad&quot;;
                const wg = defs.append(&quot;linearGradient&quot;).attr(&quot;id&quot;, wallGradId)
                    .attr(&quot;x1&quot;,&quot;0%&quot;).attr(&quot;y1&quot;,&quot;0%&quot;).attr(&quot;x2&quot;,&quot;100%&quot;).attr(&quot;y2&quot;,&quot;100%&quot;);
                wg.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;0%&quot;).attr(&quot;stop-color&quot;,&quot;rgba(255,255,255,0.04)&quot;);
                wg.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;50%&quot;).attr(&quot;stop-color&quot;,&quot;rgba(255,255,255,0.01)&quot;);
                wg.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,&quot;rgba(0,0,0,0.08)&quot;);
                g.append(&quot;rect&quot;).attr(&quot;x&quot;, d.bx*sc).attr(&quot;y&quot;, d.by*sc).attr(&quot;width&quot;, d.bw*sc).attr(&quot;height&quot;, d.bh*sc)
                    .attr(&quot;fill&quot;, `url(#${wallGradId})`).attr(&quot;pointer-events&quot;,&quot;none&quot;);
            }
            // Söve ve doğramaları maske grubunun içerisine alıyoruz
            const maskedMainG = g.append(&quot;g&quot;).attr(&quot;clip-path&quot;, `url(#${mainClipId})`);

            (d.pencereler || []).forEach((p, pi) =&gt; {
                const x = p.bbox_x*sc, y = p.bbox_y*sc, w = p.bbox_width*sc, h = p.bbox_height*sc;
                const vo = w * d.sove_orani;
                const glassId = `glass-${pi}`;
                // Glass gradient
                const gGrad = defs.append(&quot;linearGradient&quot;).attr(&quot;id&quot;, glassId)
                    .attr(&quot;x1&quot;,&quot;0%&quot;).attr(&quot;y1&quot;,&quot;0%&quot;).attr(&quot;x2&quot;,&quot;40%&quot;).attr(&quot;y2&quot;,&quot;100%&quot;);
                gGrad.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;0%&quot;).attr(&quot;stop-color&quot;,&quot;rgba(180,215,255,0.18)&quot;);
                gGrad.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;35%&quot;).attr(&quot;stop-color&quot;,&quot;rgba(100,160,220,0.06)&quot;);
                gGrad.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,&quot;rgba(40,80,140,0.12)&quot;);

                // Söve (frame surround)
                maskedMainG.append(&quot;rect&quot;).attr(&quot;x&quot;, x).attr(&quot;y&quot;, y).attr(&quot;width&quot;, w).attr(&quot;height&quot;, h).attr(&quot;fill&quot;, &quot;var(--bg)&quot;);
                maskedMainG.append(&quot;path&quot;)
                    .attr(&quot;d&quot;, `M ${x-vo},${y-vo} h ${w+vo*2} v ${h+vo*2} h ${-w-vo*2} z M ${x},${y} h ${w} v ${h} h ${-w} z`)
                    .attr(&quot;fill&quot;, d[&quot;Söve Rengi (HEX)&quot;]).attr(&quot;fill-rule&quot;, &quot;evenodd&quot;);
                // Söve inner bevel highlight
                maskedMainG.append(&quot;rect&quot;).attr(&quot;x&quot;, x-vo).attr(&quot;y&quot;, y-vo).attr(&quot;width&quot;, w+vo*2).attr(&quot;height&quot;, 2)
                    .attr(&quot;fill&quot;,&quot;rgba(255,255,255,0.08)&quot;);
                maskedMainG.append(&quot;rect&quot;).attr(&quot;x&quot;, x-vo).attr(&quot;y&quot;, y-vo).attr(&quot;width&quot;, 2).attr(&quot;height&quot;, h+vo*2)
                    .attr(&quot;fill&quot;,&quot;rgba(255,255,255,0.06)&quot;);
                // Glass fill
                maskedMainG.append(&quot;rect&quot;).attr(&quot;x&quot;, x).attr(&quot;y&quot;, y).attr(&quot;width&quot;, w).attr(&quot;height&quot;, h)
                    .attr(&quot;fill&quot;, `url(#${glassId})`);
                // Glass divider (T-cross muntin for larger windows)
                if (w &gt; 30 &amp;&amp; h &gt; 60) {
                    maskedMainG.append(&quot;line&quot;).attr(&quot;x1&quot;,x+w/2).attr(&quot;y1&quot;,y).attr(&quot;x2&quot;,x+w/2).attr(&quot;y2&quot;,y+h)
                        .attr(&quot;stroke&quot;,&quot;rgba(255,255,255,0.2)&quot;).attr(&quot;stroke-width&quot;,1.2);
                    if (h &gt; 120) {
                        maskedMainG.append(&quot;line&quot;).attr(&quot;x1&quot;,x).attr(&quot;y1&quot;,y+h*0.45).attr(&quot;x2&quot;,x+w).attr(&quot;y2&quot;,y+h*0.45)
                            .attr(&quot;stroke&quot;,&quot;rgba(255,255,255,0.2)&quot;).attr(&quot;stroke-width&quot;,1.2);
                    }
                }
                // Reflection glint
                maskedMainG.append(&quot;rect&quot;).attr(&quot;x&quot;, x+w*0.08).attr(&quot;y&quot;, y+h*0.06).attr(&quot;width&quot;, w*0.22).attr(&quot;height&quot;, h*0.22)
                    .attr(&quot;fill&quot;,&quot;rgba(255,255,255,0.07)&quot;).attr(&quot;rx&quot;,1);
                // Outer frame line
                maskedMainG.append(&quot;rect&quot;).attr(&quot;x&quot;, x).attr(&quot;y&quot;, y).attr(&quot;width&quot;, w).attr(&quot;height&quot;, h)
                    .attr(&quot;fill&quot;, &quot;none&quot;).attr(&quot;stroke&quot;, &quot;rgba(255,255,255,0.25)&quot;).attr(&quot;stroke-width&quot;, 0.8);
            });
            // Zemin çizgisi — sabit konum, tüm binalar buna oturur
            const groundLineX1 = 0;
            const groundLineX2 = svgW;
            // Zemin grubu (transform&#x27;suz, SVG koordinat sisteminde)
            const groundG = viz.append(&quot;g&quot;);
            // Ana zemin çizgisi
            groundG.append(&quot;line&quot;)
                .attr(&quot;x1&quot;, groundLineX1).attr(&quot;y1&quot;, groundY)
                .attr(&quot;x2&quot;, groundLineX2).attr(&quot;y2&quot;, groundY)
                .attr(&quot;stroke&quot;, &quot;var(--gold)&quot;).attr(&quot;stroke-width&quot;, 1.5)
                .attr(&quot;opacity&quot;, 0.7)
                .attr(&quot;stroke-dasharray&quot;, &quot;0&quot;);
            // Zemin gölge bandı
            groundG.append(&quot;rect&quot;)
                .attr(&quot;x&quot;, groundLineX1).attr(&quot;y&quot;, groundY)
                .attr(&quot;width&quot;, groundLineX2 - groundLineX1).attr(&quot;height&quot;, 8)
                .attr(&quot;fill&quot;, &quot;url(#ground-fade)&quot;)
                .attr(&quot;pointer-events&quot;, &quot;none&quot;);
            // Gradient tanımı
            const gFade = defs.append(&quot;linearGradient&quot;).attr(&quot;id&quot;, &quot;ground-fade&quot;)
                .attr(&quot;x1&quot;,&quot;0%&quot;).attr(&quot;y1&quot;,&quot;0%&quot;).attr(&quot;x2&quot;,&quot;0%&quot;).attr(&quot;y2&quot;,&quot;100%&quot;);
            gFade.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;0%&quot;).attr(&quot;stop-color&quot;,&quot;rgba(200,169,110,0.18)&quot;);
            gFade.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,&quot;rgba(200,169,110,0)&quot;);
        } // end drawDetailed
        if(data.length &gt; 0) selectBuilding(data[0], 0);
    &lt;/script&gt;

&lt;script&gt;
window.addEventListener(&#x27;message&#x27;, function(event) {
    if (event.data.action === &#x27;goToBuilding&#x27; &amp;&amp; typeof event.data.index === &#x27;number&#x27;) {
        var idx = event.data.index;
        if (idx &gt;= 0 &amp;&amp; idx &lt; data.length) {

  <h1>BODRUM ARCHITECTURAL ANALYSIS</h1>
  <div class='divider'></div>
  <div class='section'>
    <div class='section-title'>About This Study</div>
    <p>This study investigates whether the original buildings in Bodrum, Mu&#287;la&mdash;a region known for its distinct local architectural image&mdash;form the expected pattern. We examine the concept of the &ldquo;Bodrum house,&rdquo; which began as a cultural tradition and was later protected by regulations regarding the number of floors, facade materials, and window frame colors. This image holds significant architectural, historical, and touristic value.</p>
    <p>By focusing specifically on areas where original structures are preserved, we transform the facades of these &ldquo;white and stone houses with blue or white frames&rdquo; into two-dimensional, simple yet expressive icons to observe their similarities. In this way, we can explore the answer to the question, &ldquo;Is Bodrum&rsquo;s original architectural texture truly iconic enough to be called a &lsquo;Bodrum house&rsquo;?&rdquo; while simultaneously taking a look at the city&rsquo;s past and authentic architectural fabric from a single source.</p>

        <div class=&#39;file-text&#39;>## Abstract
This study investigates whether the original buildings in Bodrum, Mu&#287;la form the expected pattern. We examine the &quot;Bodrum house,&quot; which began as a cultural tradition and was later protected by regulations regarding floors, facade materials, and window frame colors.

## Research Question
How do dimensions, materials, and bounding box properties of Bodrum traditional house facades vary spatially, and what is the distribution of frame-to-jamb ratios across geographical coordinates?

## Project Specifications
- Total Records: 700 facade elements
- Unique Buildings: 84 preserved traditional structures
- Creation Date: 2026-06-10

## Technical Stack
Data Processing: Python, Pandas, NumPy, OpenCV-Python
Visualization: D3.js, Matplotlib, Seaborn, Folium
Annotation: makesense.ai

                pat.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x*scale+2).attr(&quot;y&quot;,2).attr(&quot;width&quot;,(s.w*scale)-4).attr(&quot;height&quot;,bh*0.35)
                    .attr(&quot;fill&quot;,&quot;rgba(255,255,255,0.015)&quot;);
            });
            stones2.forEach(s => {
                pat.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x*scale+1).attr(&quot;y&quot;,bh+1).attr(&quot;width&quot;,(s.w*scale)-2).attr(&quot;height&quot;,bh-2)
                    .attr(&quot;fill&quot;,&quot;rgba(190,175,145,0.04)&quot;).attr(&quot;stroke&quot;,&quot;rgba(200,169,110,0.22)&quot;).attr(&quot;stroke-width&quot;,0.8);
                pat.append(&quot;rect&quot;).attr(&quot;x&quot;,s.x*scale+2).attr(&quot;y&quot;,bh+2).attr(&quot;width&quot;,(s.w*scale)-4).attr(&quot;height&quot;,bh*0.35)
                    .attr(&quot;fill&quot;,&quot;rgba(255,255,255,0.012)&quot;);
            });
            // horizontal mortar lines
            pat.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,bh).attr(&quot;x2&quot;,bw).attr(&quot;y2&quot;,bh)
                .attr(&quot;stroke&quot;,&quot;rgba(200,169,110,0.18)&quot;).attr(&quot;stroke-width&quot;,1.5);
            return pat;
        }

function renderIcons() {
  const grid = document.getElementById('icon-grid');
  const cellW = (260 - 24 - 5) / 2; // panel width - padding - gap

  data.forEach((d, i) => {
    const cell = document.createElement('div');
    cell.className = 'icon-cell';
    cell.id = 'icon-cell-' + i;
    cell.style.cursor = 'pointer';
    cell.onclick = function() { window.parent.postMessage({ action: 'goToBuilding', index: i }, '*'); };
    grid.appendChild(cell);

    const itemSvg = d3.select(cell).append('svg')
      .attr('viewBox', `${d.bx} ${d.by} ${d.bw} ${d.bh}`)
      .attr('preserveAspectRatio', 'xMidYMid meet')
      .attr('width', '100%').attr('height', '100%');

    const defsT = itemSvg.append('defs');

    const clipId = `clip-f3-${i}`;
    defsT.append('clipPath').attr('id', clipId)
      .append('rect').attr('x', d.bx).attr('y', d.by).attr('width', d.bw).attr('height', d.bh);

    buildStonePattern(defsT, `st3-${i}`, 1);

    itemSvg.append('rect').attr('x', d.bx).attr('y', d.by).attr('width', d.bw).attr('height', d.bh)
      .attr('fill', 'var(--bg)');
    itemSvg.append('rect').attr('x', d.bx).attr('y', d.by).attr('width', d.bw).attr('height', d.bh)
      .attr('fill', d.malzeme === 't' ? `url(#st3-${i})` : 'rgba(255,255,255,0.03)')
      .attr('stroke', 'var(--gold)').attr('stroke-width', 1.5);

    const maskedG = itemSvg.append('g').attr('clip-path', `url(#${clipId})`);

    (d.pencereler || []).forEach(p => {
      const vo = p.bbox_width * d.sove_orani;
      maskedG.append('rect')
        .attr('x', p.bbox_x).attr('y', p.bbox_y)
        .attr('width', p.bbox_width).attr('height', p.bbox_height)
        .attr('fill', 'var(--bg)');
      const pD = `M ${p.bbox_x-vo},${p.bbox_y-vo} h ${p.bbox_width+vo*2} v ${p.bbox_height+vo*2} h ${-p.bbox_width-vo*2} z M ${p.bbox_x},${p.bbox_y} h ${p.bbox_width} v ${p.bbox_height} h ${-p.bbox_width} z`;
      maskedG.append('path').attr('d', pD)
        .attr('fill', d['Söve Rengi (HEX)']).attr('fill-rule', 'evenodd');
    });
  });
}

renderIcons();

function selectTab(el, tabId) {
  document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.file-viewer').forEach(v => v.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

function loadFile(input, tabId, mode) {
  const file = input.files[0];
  if (!file) return;
  const viewer = document.getElementById(tabId);
  if (mode === 'binary') {
    viewer.innerHTML = '<div class=&quot;file-content&quot;><div class=&quot;file-name&quot;>' + file.name + ' — ' + (file.size/1024).toFixed(1) + ' KB</div><div class=&quot;binary-msg&quot;>BINARY FILE — Cannot display contents.<br>File loaded successfully.</div></div>';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    viewer.innerHTML = '<div class=&quot;file-content&quot;><div class=&quot;file-name&quot;>' + file.name + ' — ' + (file.size/1024).toFixed(1) + ' KB</div><div class=&quot;file-text&quot;>' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div></div>';
  };
  reader.readAsText(file);
}
